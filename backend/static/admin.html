<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tost Kiosk — DB İzleme</title>
<style>
  :root{
    --bg:#17110d; --surface:#241b14; --raised:#2e2219; --line:#3a2c20;
    --text:#f5ede3; --muted:#a6957f; --amber:#e08c34; --red:#c4453b; --green:#5aa469;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.02em}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
  .dot.stale{background:var(--red)}
  .meta{color:var(--muted);font-size:12px}
  .counts{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
  .pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px}
  .pill b{font-family:'Space Grotesk',monospace;color:var(--amber);font-size:14px}
  main{padding:20px;display:flex;flex-direction:column;gap:26px;max-width:1100px;margin:0 auto}
  section h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
    margin:0 0 8px;font-weight:600}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:var(--raised);color:var(--muted);font-weight:600;position:sticky;top:0}
  tr:last-child td{border-bottom:none}
  td.mono{font-family:'Space Grotesk',ui-monospace,monospace}
  .tag{border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600}
  .tag.active{background:#2b3b2e;color:var(--green)}
  .tag.done{background:var(--raised);color:var(--muted)}
  .tag.ready{background:#3a1a15;color:var(--red)}
  tbody tr.new{animation:flash 1.6s ease}
  @keyframes flash{from{background:rgba(224,140,52,.28)}to{background:transparent}}
  .empty{padding:14px 12px;color:var(--muted)}
  footer{padding:16px 20px;color:var(--muted);font-size:12px;text-align:center}
  code{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
</style>
</head>
<body>
<header>
  <h1>🍞 TOST KIOSK — DB</h1>
  <span class="meta"><span class="dot" id="dot"></span> <span id="status">bağlanıyor…</span></span>
  <div class="counts" id="counts"></div>
</header>
<main>
  <section>
    <h2>users — kalıcı kayıtlar</h2>
    <div class="tablewrap"><table id="t-users"></table></div>
  </section>
  <section>
    <h2>tickets — biletler</h2>
    <div class="tablewrap"><table id="t-tickets"></table></div>
  </section>
  <section>
    <h2>card_reads — ham kart okumaları (son 200)</h2>
    <div class="tablewrap"><table id="t-reads"></table></div>
  </section>
</main>
<footer>2 sn'de bir otomatik yenilenir · yalnızca okuma · <code>/admin</code></footer>

<script>
let clockSkew = 0;
const seen = { users:new Set(), tickets:new Set(), reads:new Set() };
let first = true;

function fmtClock(ms){
  return new Date(ms).toLocaleString("tr-TR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function renderTable(el, cols, rows, keyFn, seenSet, rowClass){
  if(!rows.length){ el.innerHTML = `<tr><td class="empty">(boş)</td></tr>`; return; }
  const head = "<tr>"+cols.map(c=>`<th>${c.label}</th>`).join("")+"</tr>";
  const body = rows.map(r=>{
    const k = keyFn(r);
    const isNew = !first && !seenSet.has(k);
    seenSet.add(k);
    const cls = [isNew?"new":"", rowClass?rowClass(r):""].filter(Boolean).join(" ");
    return `<tr${cls?` class="${cls}"`:""}>`+cols.map(c=>{
      const v = c.get ? c.get(r) : esc(r[c.key]);
      return `<td${c.mono?' class="mono"':""}>${v}</td>`;
    }).join("")+"</tr>";
  }).join("");
  el.innerHTML = head + body;
}

async function tick(){
  try{
    const d = await fetch("/api/admin/data",{cache:"no-store"}).then(r=>r.json());
    clockSkew = d.now - Date.now();
    document.getElementById("dot").classList.remove("stale");
    document.getElementById("status").textContent = "canlı · "+fmtClock(d.now);

    document.getElementById("counts").innerHTML =
      `<span class="pill">users <b>${d.counts.users}</b></span>`+
      `<span class="pill">tickets <b>${d.counts.tickets_active}</b>/${d.counts.tickets}</span>`+
      `<span class="pill">okumalar <b>${d.counts.card_reads}</b></span>`;

    renderTable(document.getElementById("t-users"),
      [{label:"card_id",key:"card_id",mono:1},{label:"isim",key:"first_name"},
       {label:"soyisim",key:"last_name"},{label:"kayıt",key:"created_at"},
       {label:"güncelleme",key:"updated_at"}],
      d.users, r=>r.card_id, seen.users);

    renderTable(document.getElementById("t-tickets"),
      [{label:"id",key:"id",mono:1},{label:"card_id",key:"card_id",mono:1},
       {label:"kod",key:"code",mono:1},
       {label:"hedef saat",mono:1,get:r=>esc(fmtClock(r.scheduled_time))},
       {label:"durum",get:r=>{
          if(r.picked_up) return `<span class="tag done">teslim edildi</span>`;
          return (r.scheduled_time - (Date.now()+clockSkew) <= 0)
            ? `<span class="tag ready">HAZIR</span>`
            : `<span class="tag active">bekliyor</span>`;
        }},
       {label:"oluşturma",key:"created_at"},{label:"teslim",key:"picked_up_at"}],
      d.tickets, r=>r.id+":"+r.picked_up, seen.tickets,
      r=>r.picked_up?"":"");

    renderTable(document.getElementById("t-reads"),
      [{label:"id",key:"id",mono:1},{label:"zaman",key:"ts"},
       {label:"card_id",key:"card_id",mono:1},{label:"em4100",key:"em4100",mono:1},
       {label:"ham çerçeve",key:"raw_hex",mono:1}],
      d.card_reads, r=>r.id, seen.reads);

    first = false;
  }catch(e){
    document.getElementById("dot").classList.add("stale");
    document.getElementById("status").textContent = "bağlantı yok — yeniden deneniyor";
  }
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
